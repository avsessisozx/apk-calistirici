name: Derle

on:
  push:
    branches: [main, durum]
  pull_request:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testler
        run: python -m unittest -v

      - name: PyInstaller kur
        run: python -m pip install pyinstaller==6.22.3

      - name: Exe derle
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name ApkCalistirici calistir.pyw

      # Konsolsuz exe'nin acilip importlarin calistigini dogrular (kayit defterine dokunur ama zararsiz).
      - name: Duman testi
        shell: pwsh
        run: |
          $p = Start-Process dist\ApkCalistirici.exe -ArgumentList '--iliskiyi-kaldir' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe cikis kodu: $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: ApkCalistirici
          path: dist/ApkCalistirici.exe
          if-no-files-found: error
